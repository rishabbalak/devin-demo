spring.application.name=costco-wms

server.port=8080

# ---------------------------------------------------------------------------------------
# Datasource. H2 stands in for DB2 for i. The schema is generated from the JPA entities,
# which carry the real DB2/400 table and column names.
# ---------------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:wmsdta;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# data.sql seeds the files, and must run after Hibernate has created the tables. Without
# this, Boot 2.5+ runs the script first and every insert fails against a missing table.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# ---------------------------------------------------------------------------------------
# OpenAPI. Scanning is limited to the REST tier so the terminal controller stays out of the
# published API surface.
# ---------------------------------------------------------------------------------------
springdoc.packages-to-scan=com.costcodemo.wms.api

spring.thymeleaf.cache=false

logging.level.org.hibernate.SQL=warn
